services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: draft
      POSTGRES_PASSWORD: draft
      POSTGRES_DB: draftnight
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://draft:draft@db:5432/draftnight
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
