<svg xmlns="http://www.w3.org/2000/svg" width="90" height="22" viewBox="0 0 90 22">
  <rect x="0" y="0" width="90" height="22" fill="#000000" stroke="#808080" stroke-width="1.5"/>
  <rect x="2" y="2" width="86" height="18" fill="#111111"/>
  <!-- digit separators -->
  <line x1="16" y1="2" x2="16" y2="20" stroke="#333333"/>
  <line x1="30" y1="2" x2="30" y2="20" stroke="#333333"/>
  <line x1="45" y1="2" x2="45" y2="20" stroke="#333333"/>
  <line x1="60" y1="2" x2="60" y2="20" stroke="#333333"/>
  <line x1="75" y1="2" x2="75" y2="20" stroke="#333333"/>
  <!-- Green LED digits -->
  <text x="9" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">0</text>
  <text x="23" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">0</text>
  <text x="37" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">4</text>
  <text x="52" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">2</text>
  <text x="67" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">0</text>
  <text x="82" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#00ff00">6</text>
</svg>
