<svg xmlns="http://www.w3.org/2000/svg" width="300" height="10" viewBox="0 0 300 10">
  <defs>
    <pattern id="hz-line" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#ffd700"/>
      <polygon points="0,0 8,0 0,10" fill="#000000"/>
      <polygon points="8,10 16,10 16,0" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="300" height="10" fill="url(#hz-line)" stroke="#000000" stroke-width="1"/>
</svg>
