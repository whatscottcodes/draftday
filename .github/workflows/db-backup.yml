name: Supabase backup

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm \
            -v "$PWD:/backup" \
            -e DATABASE_URL="$DATABASE_URL" \
            postgres:17 \
            pg_dump "$DATABASE_URL" --format=custom --file=/backup/draftnight-$(date +%F).dump

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: draftnight-*.dump
          retention-days: 90
          if-no-files-found: error